<style>
  :root{
    --bg:#F2F2F4;
    --surface:#FFFFFF;
    --surface2:#F1F1F3;
    --line:#EAEAEC;
    --text:#131417;
    --muted:#8C8E94;
    --paper:#FFFFFF;
    --paper-line:#EAEAEC;
    --paper-text:#131417;
    --paper-muted:#8C8E94;
    --green:#1FA855;
    --amber:#E8A33D;
    --red:#E32227;
    --black:#131417;
    --mono: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--sans); -webkit-font-smoothing:antialiased;
  }
  .app{max-width:1120px; margin:0 auto; padding:18px 14px 70px;}
  header.top{display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:10px;}
  header.top h1{font-size:22px; margin:0; font-weight:900; letter-spacing:-0.02em; color:var(--text);}
  header.top .eyebrow{
    display:inline-block; font-size:11px; color:#fff; background:var(--red);
    text-transform:uppercase; letter-spacing:0.5px; font-weight:800;
    padding:5px 12px; border-radius:999px; margin-bottom:6px;
  }

  .warnbanner{background:rgba(232,163,61,0.14); border:1px solid rgba(232,163,61,0.5); color:#8a5b0f; border-radius:10px; padding:10px 12px; font-size:12px; margin-bottom:14px; display:none;}
  .warnbanner.show{display:block;}

  .grid-stats{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px; margin-bottom:16px;}
  .stat{background:var(--surface); border-radius:16px; padding:14px 16px; box-shadow:0 1px 2px rgba(20,20,25,0.05), 0 1px 8px rgba(20,20,25,0.05);}
  .stat .label{font-size:10px; color:var(--muted); text-transform:uppercase; letter-spacing:0.8px; margin-bottom:6px; font-weight:800;}
  .stat .value{font-size:26px; font-weight:900; letter-spacing:-0.01em; color:var(--text);}
  .stat .value.green{color:var(--green);} .stat .value.red{color:var(--red);}
  .stat .substat{font-size:10.5px; color:var(--muted); margin-top:4px; font-weight:700;}

  .panel{background:var(--surface); border-radius:16px; padding:16px 18px; margin-bottom:14px; box-shadow:0 1px 2px rgba(20,20,25,0.05), 0 1px 8px rgba(20,20,25,0.05);}
  .panel-head{display:flex; justify-content:space-between; align-items:center; cursor:pointer;}
  .panel h2{font-size:14px; margin:0; font-weight:900; text-transform:uppercase; letter-spacing:0.2px; color:var(--text);}
  .panel h2 .count{color:var(--muted); font-weight:700; font-size:11px; text-transform:none;}

<body>
<div class="app" id="app"></div>
<input type="file" id="importFile" accept="application/json" style="display:none" onchange="handleImportFile(event)">
<script>
/* ---------- storage: browser localStorage, tied to this device/browser ---------- */
const STORAGE_OK = (function(){
  try{
    const t='__test__'; localStorage.setItem(t,'1'); localStorage.removeItem(t); return true;
  }catch(e){ return false; }
})();

function getList(key){
  if(!STORAGE_OK) return (window.__mem && window.__mem[key]) || [];
  try{ const raw = localStorage.getItem(key); return raw ? JSON.parse(raw) : []; }
  catch(e){ console.error('okuma hatası', e); return []; }
}
function saveList(key, list){
  if(!STORAGE_OK){ window.__mem = window.__mem||{}; window.__mem[key]=list; return true; }
  try{ localStorage.setItem(key, JSON.stringify(list)); return true; }
  catch(e){ console.error('yazma hatası', e); return false; }
}

let students = [];
let payments = [];
let installments = []; // {id, studentId, amount, dueDate, paid, paidDate, note, createdAt}
let ready = false;
let expanded = {};
let searchQ = '';
let allHistoryOpen = false;
let calendarOpen = false;
let calendarYear = new Date().getFullYear();
let monthOpen = {};
let addModalOpen = false;
let editingStudentId = null;
let editingPaymentId = null;
let installmentModalStudentId = null;
let confirmState = null; // {message, action}
let alertState = null; // string
let invoiceContacts = []; // {id, studentId, name, tcNo, address, email, phone, updatedAt}
let invoiceOpen = false;

function loadAll(){
  students = getList('coach_students_v3');
  payments = getList('coach_payments_v3');
  installments = getList('coach_installments_v1');
  invoiceContacts = getList('coach_invoice_contacts_v1');
  ready = true;
  render();
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function todayStr(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  return `${y}-${m}-${day}`;
}
function fmtDate(d){ if(!d) return '—'; const dt=new Date(d+'T00:00:00'); return dt.toLocaleDateString('tr-TR',{day:'2-digit',month:'2-digit',year:'numeric'}); }
function fmtMoney(n){ return (n||0).toLocaleString('tr-TR')+' ₺'; }
function initials(name){
  return (name||'').trim().split(/\s+/).slice(0,2).map(w=>w[0]).join('').toUpperCase();
}
function isThisMonth(d){ if(!d) return false; const now=new Date(); const dt=new Date(d+'T00:00:00'); return dt.getFullYear()===now.getFullYear() && dt.getMonth()===now.getMonth(); }

function studentPayments(sid){
  return payments.filter(p=>p.studentId===sid).sort((a,b)=> b.date.localeCompare(a.date) || (b.createdAt||'').localeCompare(a.createdAt||''));
}
function studentTotal(sid){ return payments.filter(p=>p.studentId===sid).reduce((s,p)=>s+Number(p.amount||0),0); }

function daysBetween(dateStr){
  const today = new Date(todayStr()+'T00:00:00');
  const target = new Date(dateStr+'T00:00:00');
  return Math.round((target - today) / 86400000);
}
function installmentStatus(inst){
  if(inst.paid) return 'paid';
  const d = daysBetween(inst.dueDate);
  if(d < 0) return 'overdue';
  if(d <= 7) return 'upcoming';
  return 'scheduled';
}
function studentInstallments(sid){
  return installments.filter(i=>i.studentId===sid).sort((a,b)=> a.dueDate.localeCompare(b.dueDate));
}
function pendingInstallments(){
  return installments.filter(i=>!i.paid).sort((a,b)=> a.dueDate.localeCompare(b.dueDate));
}
function installmentStatusLabel(status){
  if(status==='overdue') return 'Gecikti';
  if(status==='upcoming') return 'Bu hafta';
  if(status==='paid') return 'Ödendi';
  return 'Planlandı';
}
function installmentStatusClass(status){
  if(status==='overdue') return 'unpaid';
  if(status==='upcoming') return 'pending2';
  if(status==='paid') return 'paid';
  return 'never';
}

function monthKey(d){ return d.slice(0,7); }
function monthLabel(key){
  const [y,m] = key.split('-').map(Number);
  const dt = new Date(y, m-1, 1);
  return dt.toLocaleDateString('tr-TR', {month:'long', year:'numeric'});
}
function monthlyBreakdown(){
  const map = {};
  payments.forEach(p=>{
    const key = monthKey(p.date);
    if(!map[key]) map[key] = {total:0, items:[]};
    map[key].total += Number(p.amount||0);
    map[key].items.push(p);
  });
  return Object.keys(map).sort().reverse().map(key=>({
    key,
    label: monthLabel(key),
    total: map[key].total,
    items: map[key].items.slice().sort((a,b)=> b.date.localeCompare(a.date))
  }));
}

function globalStats(){
  const totalAll = payments.reduce((s,p)=>s+Number(p.amount||0),0);
  const totalMonth = payments.filter(p=>isThisMonth(p.date)).reduce((s,p)=>s+Number(p.amount||0),0);
  const paidThisMonth = students.filter(s=> studentPayments(s.id).some(p=>isThisMonth(p.date))).length;
  const unpaidThisMonth = students.length - paidThisMonth;
  const monthsEarnedCount = new Set(payments.map(p=>monthKey(p.date))).size;
  const pending = pendingInstallments();
  const overdueInstallments = pending.filter(i=>installmentStatus(i)==='overdue');
  const upcomingInstallments = pending.filter(i=>installmentStatus(i)==='upcoming');
  const pendingInstallmentTotal = pending.reduce((s,i)=>s+Number(i.amount||0),0);
  const debtors = students.filter(s=>s.debt);
  const debtorsTotal = debtors.reduce((s,st)=>s+Number(st.debt||0),0);
  return {totalAll, totalMonth, paidThisMonth, unpaidThisMonth, monthsEarnedCount, pending, overdueInstallments, upcomingInstallments, pendingInstallmentTotal, debtors, debtorsTotal};
}

  if(!ready){ app.innerHTML='<p style="color:var(--muted);padding:40px;text-align:center;">Yükleniyor…</p>'; return; }
  const g = globalStats();
  let h = `

      <button class="iconbtn" onclick="openInvoiceModal()" title="Fatura" aria-label="Fatura"><svg viewBox="0 0 100 100" width="44" height="44" xmlns="http://www.w3.org/2000/svg">

87 20.51 L 26.04 22.10 L 75.13 21.47 L 73.22 19.23 L 26.14 19.02 Z" fill="#161616"/></g>
</svg></button>
    </div>
  </header>
  <div class="warnbanner ${STORAGE_OK?'':'show'}">Bu tarayıcıda kalıcı depolama kullanılamıyor (gizli/özel sekme olabilir). Veriler yalnızca bu oturum boyunca tutulacak — sayfayı kapatmadan önce mutlaka yeşil disket ile kaydedin.</div>
  <div class="grid-stats">
    <div class="stat"><div class="label">Toplam Öğrenci</div><div class="value">${students.length}</div></div>
    <div class="stat"><div class="label">Bu Ay Ödeyen</div><div class="value green">${g.paidThisMonth}</div></div>
    <div class="stat"><div class="label">Bu Ay Ödemeyen</div><div class="value ${g.unpaidThisMonth>0?'red':''}">${g.unpaidThisMonth}</div></div>
    <div class="stat"><div class="label">Bu Ay Tahsilat</div><div class="value">${fmtMoney(g.totalMonth)}</div></div>
    <div class="stat"><div class="label">Toplam Tahsilat</div><div class="value">${fmtMoney(g.totalAll)}</div><div class="substat">${g.monthsEarnedCount} ayda kazanıldı</div></div>
    <div class="stat calendar-toggle-card" onclick="toggleCalendar()">
      <div class="label">${calendarOpen ? 'Kapat' : 'Görüntüle'}</div>
      <div class="value" style="font-size:16px; display:flex; align-items:center; gap:6px;">📅 Yıllık Takvim</div>
    </div>
  </div>
  ${calendarOpen ? renderCalendarPanel() : ''}
  ${g.pending.length ? `
  <section class="panel" style="border-color:${g.overdueInstallments.length?'rgba(225,80,61,0.4)':(g.upcomingInstallments.length?'rgba(232,163,61,0.4)':'var(--line)')};">
    <h2 style="margin-bottom:10px;">⏰ Taksit Takibi <span class="count">(${g.pending.length} bekleyen · ${fmtMoney(g.pendingInstallmentTotal)})</span></h2>

  ${g.debtors.length ? `

    ${g.debtors.map(s=>`<div class="row-item"><span class="name">${s.name}${s.debtDate? ` <span class="sub" style="font-weight:600;">· ${fmtDate(s.debtDate)}</span>` : ''}</span><span style="color:var(--red); font-weight:900;">-${fmtMoney(s.debt)}</span></div>`).join('')}
  </section>` : ''}
  <section class="panel">
    <div class="panel-head" onclick="toggleAllHistory()">
      <h2>Tüm Ödemeler <span class="count">(geçmiş dahil · ${payments.length} kayıt)</span></h2>
      <span class="hist-toggle">${allHistoryOpen? 'Gizle' : 'Göster'}</span>

    const hist = studentPayments(s.id);
    const last = hist[0];
    const paidNow = last && isThisMonth(last.date);
    let badge = `<span class="badge never">Hiç ödeme yok</span>`;
    if(last){ badge = paidNow? `<span class="badge paid">Bu ay ödedi</span>` : `<span class="badge unpaid">Bu ay ödemedi</span>`; }

      </div>
      <div style="margin-top:10px;"><span class="hist-toggle" onclick="toggleHist('${s.id}')">${expanded[s.id] ? 'Geçmişi Gizle' : 'Geçmiş ('+hist.length+')'}</span></div>`;
    if(expanded[s.id]){
      h += `<div class="histbox" style="margin-top:8px;">`;
      if(hist.length===0){ h += `<div class="empty">Henüz ödeme kaydı yok.</div>`; }
      else{
        hist.forEach(p=>{
          h += `<div class="hrow"><span>${fmtDate(p.date)}</span><span>${fmtMoney(p.amount)}</span><span style="display:flex;gap:8px;"><button class="linklike" onclick="openEditPaymentModal('${p.id}')">Düzenle</button><button class="del" onclick="deletePayment('${p.id}')">Sil</button></span></div>`;
        });
      }
      const sInst = studentInstallments(s.id);
      if(sInst.length){
        h += `<div style="margin-top:10px; padding-top:8px; border-top:1px solid var(--line); font-weight:800; font-size:12px;">Taksitler</div>`;
        sInst.forEach(i=>{
          const status = installmentStatus(i);
          h += `<div class="hrow"><span>${fmtDate(i.dueDate)}${i.note? ' · '+i.note : ''}</span><span>${fmtMoney(i.amount)}</span><span style="display:flex;gap:8px;align-items:center;">
            <span class="badge ${installmentStatusClass(status)}" style="font-size:10px;">${installmentStatusLabel(status)}</span>
            ${!i.paid? `<button class="linklike" onclick="markInstallmentPaid('${i.id}')">Ödendi İşaretle</button>`:''}
            <button class="linklike" onclick="openEditInstallmentModal('${i.id}')">Düzenle</button>
            <button class="del" onclick="deleteInstallment('${i.id}')">Sil</button>
          </span></div>`;
        });
      }
      h += `</div>`;
    }
    h += `</div>`;
  });

  h += `</div>
  <footer class="note">"Ücret Ödendi" butonuna bastığında bugünün tarihi ve o öğrenci için tanımlı ücret otomatik kaydedilir. Fiyat sonradan değişse bile geçmiş ödemeler o günkü tutarıyla kalır. Veriler bu cihaz/tarayıcıda saklanır — düzenli olarak "Yedekle" ile dosyaya kaydetmeniz önerilir.</footer>`;

  app.innerHTML = h;
  if(addModalOpen) renderAddModal();
  if(editingStudentId) renderEditModal();
  if(editingPaymentId) renderEditPaymentModal();
  if(installmentModalStudentId) renderInstallmentModal();
  if(editingInstallmentId) renderEditInstallmentModal();
  if(textBackupOpen) renderTextBackupModal();
  if(textImportOpen) renderTextImportModal();
  if(invoiceOpen) renderInvoiceModal();
  if(confirmState) renderConfirmModal();
  if(alertState) renderAlertModal();
}

function onSearch(v){ searchQ=v; render(); const el=document.querySelector('.toolbar input'); if(el){ el.focus(); el.setSelectionRange(v.length,v.length);} }
function toggleHist(sid){ expanded[sid] = !expanded[sid]; render(); }
function toggleAllHistory(){ allHistoryOpen = !allHistoryOpen; render(); }
function toggleCalendar(){ calendarOpen = !calendarOpen; render(); }
function changeCalendarYear(delta){ calendarYear += delta; render(); }
const MONTH_SHORT = ['Oca','Şub','Mar','Nis','May','Haz','Tem','Ağu','Eyl','Eki','Kas','Ara'];
function monthTotal(year, monthIdx){
  return payments.filter(p=>{
    const [y,m] = p.date.split('-').map(Number);
    return y===year && (m-1)===monthIdx;
  }).reduce((s,p)=>s+Number(p.amount||0),0);
}
function renderCalendarPanel(){
  const now = new Date();
  const isCurrentYear = calendarYear === now.getFullYear();
  let cells = '';
  for(let i=0;i<12;i++){
    const total = monthTotal(calendarYear, i);
    let prevTotal;
    if(i===0){ prevTotal = monthTotal(calendarYear-1, 11); }
    else{ prevTotal = monthTotal(calendarYear, i-1); }
    let arrow = '';
    if(prevTotal>0 && total>prevTotal){ arrow = `<span style="color:var(--green); font-weight:900;">▲</span>`; }
    else if(prevTotal>0 && total<prevTotal){ arrow = `<span style="color:var(--red); font-weight:900;">▼</span>`; }
    const isThisMonthCell = isCurrentYear && i===now.getMonth();
    cells += `<div class="cal-cell ${isThisMonthCell?'cal-cell-active':''}">
      <div class="cal-month">${MONTH_SHORT[i]}</div>
      <div class="cal-amount">${fmtMoney(total)} ${arrow}</div>
    </div>`;
  }
  return `<section class="panel">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:12px;">
      <button class="editbtn" onclick="changeCalendarYear(-1)">‹</button>
      <h2 style="margin:0;">${calendarYear}</h2>
      <button class="editbtn" onclick="changeCalendarYear(1)">›</button>
    </div>
    <div class="cal-grid">${cells}</div>
  </section>`;
}
function toggleMonth(key){ monthOpen[key] = !monthOpen[key]; render(); }
function renderMonthlyBreakdown(){
  const months = monthlyBreakdown();
  if(months.length===0){ return `<div class="empty">Henüz kayıtlı ödeme yok.</div>`; }
  let out = '';
  months.forEach(mo=>{
    out += `<div class="month-row" onclick="toggleMonth('${mo.key}')">
      <span class="month-label">${mo.label}</span>
      <span class="month-meta">${mo.items.length} ödeme</span>
      <span class="month-total mono">${fmtMoney(mo.total)}</span>
    </div>`;
    if(monthOpen[mo.key]){
      out += `<div class="histbox" style="margin-left:0;">`;
      mo.items.forEach(p=>{
        const pendingForStudent = studentInstallments(p.studentId).filter(i=>!i.paid);
        out += `<div class="hrow" style="align-items:flex-start;"><span>${memberNameOf(p.studentId)}</span><span>${fmtDate(p.date)}</span><span>${fmtMoney(p.amount)}</span></div>`;
        if(pendingForStudent.length){
          out += `<div style="padding:2px 0 6px 4px; font-size:11px; color:var(--paper-muted);">
            🗓️ ${pendingForStudent.length} bekleyen taksit: ${pendingForStudent.map(i=> fmtMoney(i.amount)+' ('+fmtDate(i.dueDate)+')').join(', ')}
          </div>`;
        }
      });
      out += `</div>`;
    }
  });
  return out;
}
function memberNameOf(sid){ const s = students.find(x=>x.id===sid); return s ? s.name : '(silinmiş öğrenci)'; }
let instStudentExpanded = {};
function toggleInstStudent(sid){ instStudentExpanded[sid] = !instStudentExpanded[sid]; render(); }
function renderInstallmentList(list){
  if(list.length===0){ return `<div class="empty">Bekleyen taksit yok.</div>`; }
  const groups = {};
  list.forEach(i=>{
    if(!groups[i.studentId]) groups[i.studentId] = [];
    groups[i.studentId].push(i);
  });
  let out = '';
  Object.keys(groups).forEach(sid=>{
    const items = groups[sid].slice().sort((a,b)=> a.dueDate.localeCompare(b.dueDate));
    const total = items.reduce((s,i)=>s+Number(i.amount||0),0);
    const worst = items.some(i=>installmentStatus(i)==='overdue') ? 'overdue' : (items.some(i=>installmentStatus(i)==='upcoming') ? 'upcoming' : 'scheduled');
    const isOpen = !!instStudentExpanded[sid];
    out += `<div class="row-item" style="cursor:pointer;" onclick="toggleInstStudent('${sid}')">
      <div><div class="name">${memberNameOf(sid)}</div><div class="sub">${items.length} taksit · Toplam ${fmtMoney(total)}</div></div>
      <div style="display:flex;gap:8px;align-items:center;">
        <span class="badge ${installmentStatusClass(worst)}">${installmentStatusLabel(worst)}</span>
        <span class="hist-toggle">${isOpen? 'Gizle' : 'Göster'}</span>
      </div>
    </div>`;
    if(isOpen){
      out += `<div class="histbox" style="margin:6px 0 4px;">`;
      items.forEach(i=>{
        const status = installmentStatus(i);
        out += `<div class="hrow" style="align-items:center;">
          <span>${fmtDate(i.dueDate)}${i.note? ' · '+i.note : ''}</span>
          <span>${fmtMoney(i.amount)}</span>
          <span style="display:flex;gap:8px;align-items:center;">
            <span class="badge ${installmentStatusClass(status)}" style="font-size:10px;">${installmentStatusLabel(status)}</span>
            <button class="linklike" onclick="event.stopPropagation(); markInstallmentPaid('${i.id}')">Ödendi</button>
            <button class="linklike" onclick="event.stopPropagation(); openEditInstallmentModal('${i.id}')">Düzenle</button>
            <button class="del" onclick="event.stopPropagation(); deleteInstallment('${i.id}')">Sil</button>
          </span>
        </div>`;
      });
      out += `</div>`;
    }
  });
  return out;
}

function markPaidToday(sid){
  const s = students.find(x=>x.id===sid);
  if(!s) return;
  payments.push({id:uid(), studentId:sid, amount:s.price, date:todayStr(), createdAt:new Date().toISOString()});
  saveList('coach_payments_v3', payments);
  if(s.debt){ s.debt = null; s.debtDate = null; saveList('coach_students_v3', students); }
  render();
}
function addCredit(sid){
  const s = students.find(x=>x.id===sid);
  if(!s) return;
  if(s.debt){ s.debt = null; s.debtDate = null; }
  else { s.debt = Number(s.price); s.debtDate = todayStr(); }
  saveList('coach_students_v3', students);
  render();
}
function deletePayment(pid){
  askConfirm('Bu ödeme kaydı silinecek.', ()=>{
    payments = payments.filter(p=>p.id!==pid);
    saveList('coach_payments_v3', payments);
    render();
  });
}
function deleteStudent(sid){
  const pending = installments.filter(i=>i.studentId===sid && !i.paid);
  let message = 'Bu öğrenci ve tüm ödeme kayıtları silinecek.';
  if(pending.length){
    const byMonth = {};
    pending.forEach(i=>{
      const [y,m] = i.dueDate.split('-').map(Number);
      const key = `${MONTH_SHORT[m-1]} ${y}`;
      byMonth[key] = (byMonth[key]||0) + Number(i.amount||0);
    });
    const lines = Object.keys(byMonth).map(k=> `${k}: ${fmtMoney(byMonth[k])}`).join(', ');
    message = `Bu öğrencinin henüz ödenmemiş taksitleri var — ${lines}. Öğrenci silinirse bu taksitler de tamamen kaldırılacak. Yine de silmek istiyor musunuz?`;
  }
  askConfirm(message, ()=>{
    students = students.filter(s=>s.id!==sid);
    payments = payments.filter(p=>p.studentId!==sid);
    installments = installments.filter(i=>i.studentId!==sid);
    saveList('coach_students_v3', students);
    saveList('coach_payments_v3', payments);
    saveList('coach_installments_v1', installments);
    render();
  });
}

function askConfirm(message, action){ confirmState = {message, action}; render(); }
function cancelConfirm(){ confirmState = null; const ov=document.getElementById('confirmOverlay'); if(ov) ov.remove(); }
function confirmYes(){
  const act = confirmState && confirmState.action;
  confirmState = null;
  const ov=document.getElementById('confirmOverlay'); if(ov) ov.remove();

}
function renderConfirmModal(){
  const existing = document.getElementById('confirmOverlay'); if(existing) existing.remove();

let invoiceDraft = null; // persists form values across re-renders (e.g. when an alert/confirm modal also renders)
function blankInvoiceDraft(){
  return { studentId:'', name:'', tcNo:'', address:'', email:'', phone:'', desc:'', amount:'', date: todayStr() };
}
function openInvoiceModal(){
  invoiceOpen = true;
  invoiceDraft = blankInvoiceDraft();
  render();
}
function closeInvoiceModal(){
  invoiceOpen = false;
  invoiceDraft = null;
  const ov=document.getElementById('invoiceOverlay'); if(ov) ov.remove();
}
function invoiceContactForStudent(sid){
  return invoiceContacts.find(c=>c.studentId && c.studentId===sid);
}
function syncInvoiceDraftFromDOM(){
  if(!invoiceDraft) invoiceDraft = blankInvoiceDraft();
  const g = (id)=>{ const el=document.getElementById(id); return el ? el.value : undefined; };
  const vals = {
    studentId: g('inv_student'), name: g('inv_name'), tcNo: g('inv_tc'), address: g('inv_address'),
    email: g('inv_email'), phone: g('inv_phone'), desc: g('inv_desc'), amount: g('inv_amount'), date: g('inv_date')
  };
  Object.keys(vals).forEach(k=>{ if(vals[k]!==undefined) invoiceDraft[k]=vals[k]; });
  return invoiceDraft;
}
function onInvoiceStudentChange(sid){
  const f = syncInvoiceDraftFromDOM();
  const s = students.find(x=>x.id===sid);
  const c = sid ? invoiceContactForStudent(sid) : null;
  f.studentId = sid;
  f.name = c ? c.name : (s ? s.name : '');
  f.tcNo = c ? (c.tcNo||'') : '';
  f.address = c ? (c.address||'') : '';
  f.email = c ? (c.email||'') : '';
  f.phone = c ? (c.phone||'') : '';
  if(s && !f.amount) f.amount = s.price;
  renderInvoiceModal();
}
function selectInvoiceContact(cid){
  const c = invoiceContacts.find(x=>x.id===cid);
  if(!c) return;
  const f = syncInvoiceDraftFromDOM();
  f.studentId = c.studentId || '';
  f.name = c.name || '';
  f.tcNo = c.tcNo || '';
  f.address = c.address || '';
  f.email = c.email || '';
  f.phone = c.phone || '';
  const s = c.studentId ? students.find(x=>x.id===c.studentId) : null;
  if(s && !f.amount) f.amount = s.price;
  renderInvoiceModal();
}
function deleteInvoiceContact(cid){
  askConfirm('Bu kayıtlı kişi silinsin mi?', ()=>{
    invoiceContacts = invoiceContacts.filter(c=>c.id!==cid);
    saveList('coach_invoice_contacts_v1', invoiceContacts);
    render();
  });
}
function submitInvoiceContact(){
  const f = syncInvoiceDraftFromDOM();
  if(!f.name || !f.name.trim()){ showAlert('Ad Soyad girin.'); return; }
  if(!f.tcNo || !String(f.tcNo).trim()){ showAlert('TC Kimlik No girin.'); return; }
  if(!f.address || !f.address.trim()){ showAlert('Adres girin.'); return; }
  const sid = f.studentId || '';
  let existing = sid ? invoiceContactForStudent(sid) : invoiceContacts.find(c=>!c.studentId && c.tcNo===f.tcNo);
  if(existing){
    existing.name = f.name.trim();
    existing.tcNo = String(f.tcNo).trim();
    existing.address = f.address.trim();
    existing.email = (f.email||'').trim();
    existing.phone = (f.phone||'').trim();
    existing.updatedAt = new Date().toISOString();
  } else {
    invoiceContacts.push({
      id: uid(), studentId: sid || null,
      name: f.name.trim(), tcNo: String(f.tcNo).trim(), address: f.address.trim(),
      email: (f.email||'').trim(), phone: (f.phone||'').trim(),
      updatedAt: new Date().toISOString()
    });
  }
  saveList('coach_invoice_contacts_v1', invoiceContacts);
  showAlert('Kişi kaydedildi. Bu bilgilerle bir dahaki sefere tek dokunuşla fatura hazırlayabilirsiniz.');
}
function renderInvoiceModal(){
  const existing = document.getElementById('invoiceOverlay'); if(existing) existing.remove();

  const studentOptions = `<option value="">Bireysel Fatura</option>` +
    students.slice().sort((a,b)=>a.name.localeCompare(b.name,'tr')).map(s=>`<option value="${s.id}" ${f.studentId===s.id?'selected':''}>${s.name}</option>`).join('');

  div.innerHTML = `<div class="modal" style="max-width:480px;" onclick="event.stopPropagation()">
    <h3>Fatura</h3>

    <div style="font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px; font-weight:800; margin-bottom:8px;">Kayıtlı Kişiler</div>
    <div class="tablewrap" style="margin-bottom:18px; max-height:160px; overflow-y:auto;">
      <div style="padding:2px 12px;">${contactsHtml}</div>
    </div>

    <div style="font-size:17px; font-weight:900; color:var(--text); margin-bottom:10px;">Fatura Bilgileri</div>
    <div class="field"><label>Öğrenci</label>
      <select id="inv_student" onchange="onInvoiceStudentChange(this.value)" style="width:100%; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--surface2); color:var(--text); font-size:16px;">
        ${studentOptions}
      </select>
    </div>
    <div class="field"><label>Ad Soyad</label><input type="text" id="inv_name" value="${f.name||''}"></div>
    <div class="field"><label>TC Kimlik No</label><input type="text" inputmode="numeric" maxlength="11" id="inv_tc" value="${f.tcNo||''}"></div>
    <div class="field"><label>Adres</label><input type="text" id="inv_address" value="${f.address||''}"></div>
    <div class="field"><label>E-posta</label><input type="text" id="inv_email" value="${f.email||''}"></div>
    <div class="field"><label>Telefon</label><input type="text" id="inv_phone" value="${f.phone||''}"></div>
    <div class="field"><label>Ders Paketi Açıklaması</label><input type="text" id="inv_desc" value="${f.desc||''}"></div>
    <div class="field"><label>Tutar (₺)</label><input type="number" min="0" id="inv_amount" value="${f.amount||''}"></div>
    <div class="field"><label>Fatura Tarihi</label><input type="date" id="inv_date" value="${f.date||todayStr()}"></div>

    <div class="modal-actions">
      <button class="secondary" onclick="closeInvoiceModal()">Kapat</button>
      <button class="primary" onclick="submitInvoiceContact()">Kişiyi Kaydet</button>
    </div>
  </div>`;
  document.body.appendChild(div);

  const existing = document.getElementById('editPayOverlay'); if(existing) existing.remove();
  const div = document.createElement('div'); div.id='editPayOverlay'; div.className='overlay';
  div.onclick=(e)=>{ if(e.target===div) closeEditPaymentModal(); };
  div.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <h3>Ödemeyi Düzenle${s? ' — '+s.name : ''}</h3>
    <div class="field"><label>Ödeme Tarihi</label><input type="date" id="ep_date" value="${p.date}"></div>
    <div class="field"><label>Tutar (₺)</label><input type="number" min="0" id="ep_amount" value="${p.amount}" onkeydown="if(event.key==='Enter'){submitEditPayment()}"></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeEditPaymentModal()">Vazgeç</button>
      <button class="primary" onclick="submitEditPayment()">Kaydet</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
function submitEditPayment(){
  const p = payments.find(x=>x.id===editingPaymentId);
  if(!p) return;
  const date = document.getElementById('ep_date').value;
  const amount = Number(document.getElementById('ep_amount').value||0);
  if(!date){ showAlert('Tarih girin.'); return; }
  if(!amount || amount<=0){ showAlert('Geçerli bir tutar girin.'); return; }
  p.date = date; p.amount = amount;
  saveList('coach_payments_v3', payments);
  closeEditPaymentModal();
  render();
}

/* ---------- installments (taksitler) ---------- */
let instRows = []; // [{id, amount, date}]
function openInstallmentModal(sid){
  installmentModalStudentId = sid;
  instRows = [];
  render();
}
function closeInstallmentModal(){ installmentModalStudentId = null; instRows=[]; const ov=document.getElementById('instOverlay'); if(ov) ov.remove(); }
function syncInstRowsFromDOM(){
  instRows.forEach(row=>{
    const a = document.getElementById('row_amount_'+row.id);
    const d = document.getElementById('row_date_'+row.id);
    if(a) row.amount = a.value;
    if(d) row.date = d.value;
  });
  const uf = document.getElementById('i_upfront');
  if(uf) instRows._upfront = uf.value;
}
function addInstallmentRow(){
  syncInstRowsFromDOM();
  let suggestedDate = todayStr();
  const last = instRows[instRows.length-1];
  if(last && last.date){
    const [y,m,dd] = last.date.split('-').map(Number);
    const d = new Date(y, m-1, dd);
    d.setMonth(d.getMonth()+1);
    const yy = d.getFullYear();
    const mm = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    suggestedDate = `${yy}-${mm}-${day}`;
  }
  instRows.push({id:uid(), amount:'', date:suggestedDate});
  render();
}
function removeInstallmentRow(rid){
  syncInstRowsFromDOM();
  instRows = instRows.filter(r=>r.id!==rid);
  render();
}
function renderInstallmentModal(){
  const s = students.find(x=>x.id===installmentModalStudentId);
  if(!s){ installmentModalStudentId=null; return; }
  const existing = document.getElementById('instOverlay'); if(existing) existing.remove();
  const div = document.createElement('div'); div.id='instOverlay'; div.className='overlay';
  div.onclick=(e)=>{ if(e.target===div) closeInstallmentModal(); };
  const upfrontVal = instRows._upfront || '';
  let rowsHtml = '';
  instRows.forEach((row,idx)=>{
    rowsHtml += `<div style="display:flex; align-items:center; gap:6px; padding:7px 0; ${idx>0 ? 'border-top:1px solid var(--line);' : ''}">
      <span style="flex:0 0 auto; font-size:11px; font-weight:800; color:var(--muted); font-family:var(--mono); white-space:nowrap;">${idx+1}. Taksit</span>
      <input type="number" min="0" id="row_amount_${row.id}" value="${row.amount}" placeholder="Tutar" style="flex:1 1 0; min-width:0; padding:10px 8px; border-radius:10px; border:1px solid var(--line); background:var(--surface2); color:var(--text); font-size:16px;">
      <input type="date" id="row_date_${row.id}" value="${row.date}" style="flex:1 1 0; min-width:0; padding:10px 6px; border-radius:10px; border:1px solid var(--line); background:var(--surface2); color:var(--text); font-size:16px;">
      <button type="button" onclick="removeInstallmentRow('${row.id}')" aria-label="Taksiti Sil" style="flex:0 0 auto; width:26px; height:26px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--red); font-size:13px; line-height:1; cursor:pointer;">✕</button>
    </div>`;
  });
  div.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <h3>Taksitli Paket — ${s.name}</h3>
    <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">Örn: 30 derslik paket — bir kısmı bugün alınıyor (peşinat), kalanı istediğin sayıda taksitle, her biri ayrı tarih ve tutarla.</p>
    <div class="field" style="margin-bottom:8px;"><label>Peşinat / Şimdi Alınan Tutar (varsa, ₺)</label><input type="number" min="0" id="i_upfront" value="${upfrontVal}" placeholder="Örn: 10000 (yoksa boş bırakın)"></div>
    <p style="font-size:11px;color:var(--muted);margin:-4px 0 10px;">Girilirse bugünün tarihiyle hemen ödeme olarak kaydedilir.</p>
    ${rowsHtml}
    <button class="secondary" style="width:100%; margin-top:${instRows.length?'10px':'0'}; margin-bottom:14px;" onclick="addInstallmentRow()">+ Taksit Ekle</button>
    <div class="modal-actions">
      <button class="secondary" onclick="closeInstallmentModal()">Vazgeç</button>
      <button class="primary" onclick="submitInstallment()">Kaydet</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
function submitInstallment(){
  syncInstRowsFromDOM();
  const sid = installmentModalStudentId;
  const upfront = Number(instRows._upfront||0);
  const validRows = instRows.filter(r=> Number(r.amount)>0);
  const invalidRow = validRows.find(r=> !r.date);
  if(!upfront && validRows.length===0){ showAlert('Peşinat veya en az bir taksit satırı girin.'); return; }
  if(invalidRow){ showAlert('Tutar girilen her taksit satırı için vade tarihi de girilmeli.'); return; }
  if(upfront>0){
    payments.push({id:uid(), studentId:sid, amount:upfront, date:todayStr(), createdAt:new Date().toISOString(), note:'Peşinat'});
    saveList('coach_payments_v3', payments);
  }
  instRows.forEach((r,idx)=>{
    if(Number(r.amount)>0){
      installments.push({id:uid(), studentId:sid, amount:Number(r.amount), dueDate:r.date, paid:false, paidDate:null, note:`${idx+1}. Taksit`, createdAt:new Date().toISOString()});
    }
  });
  if(validRows.length){ saveList('coach_installments_v1', installments); }
  closeInstallmentModal();
  render();
}
function markInstallmentPaid(iid){
  const i = installments.find(x=>x.id===iid);
  if(!i) return;
  i.paid = true;
  i.paidDate = todayStr();
  payments.push({id:uid(), studentId:i.studentId, amount:i.amount, date:todayStr(), createdAt:new Date().toISOString(), note:i.note||'Taksit ödemesi'});
  saveList('coach_installments_v1', installments);
  saveList('coach_payments_v3', payments);
  render();
}
function deleteInstallment(iid){
  askConfirm('Bu taksit planı silinecek (henüz kaydedilmiş bir ödemeyi silmez).', ()=>{
    installments = installments.filter(x=>x.id!==iid);
    saveList('coach_installments_v1', installments);
    render();
  });
}
let editingInstallmentId = null;
function openEditInstallmentModal(iid){ editingInstallmentId = iid; render(); }
function closeEditInstallmentModal(){ editingInstallmentId = null; const ov=document.getElementById('editInstOverlay'); if(ov) ov.remove(); }
function renderEditInstallmentModal(){
  const i = installments.find(x=>x.id===editingInstallmentId);
  if(!i){ editingInstallmentId=null; return; }
  const s = students.find(x=>x.id===i.studentId);
  const existing = document.getElementById('editInstOverlay'); if(existing) existing.remove();
  const div = document.createElement('div'); div.id='editInstOverlay'; div.className='overlay';
  div.onclick=(e)=>{ if(e.target===div) closeEditInstallmentModal(); };
  div.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <h3>Taksiti Düzenle${s? ' — '+s.name : ''}</h3>
    <div class="field"><label>Tutar (₺)</label><input type="number" min="0" id="ei_amount" value="${i.amount}"></div>
    <div class="field"><label>Vade Tarihi</label><input type="date" id="ei_date" value="${i.dueDate}"></div>
    <div class="field"><label>Not (opsiyonel)</label><input type="text" id="ei_note" value="${i.note||''}" onkeydown="if(event.key==='Enter'){submitEditInstallment()}"></div>
    <div class="modal-actions">
      <button class="secondary" onclick="closeEditInstallmentModal()">Vazgeç</button>
      <button class="primary" onclick="submitEditInstallment()">Kaydet</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
function submitEditInstallment(){
  const i = installments.find(x=>x.id===editingInstallmentId);
  if(!i) return;
  const amount = Number(document.getElementById('ei_amount').value||0);
  const dueDate = document.getElementById('ei_date').value;
  const note = document.getElementById('ei_note').value.trim();
  if(!amount || amount<=0){ showAlert('Geçerli bir tutar girin.'); return; }
  if(!dueDate){ showAlert('Vade tarihi girin.'); return; }
  i.amount = amount; i.dueDate = dueDate; i.note = note;
  saveList('coach_installments_v1', installments);
  closeEditInstallmentModal();
  render();
}

/* ---------- backup / restore ---------- */
function exportBackup(){
  try{
    const data = {students, payments, installments, invoiceContacts, exportedAt:new Date().toISOString()};
    const blob = new Blob([JSON.stringify(data,null,2)], {type:'application/json'});
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'odeme-takip-yedek-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }catch(e){
    console.error('indirme hatası', e);
    showAlert('Dosya indirme bu ekranda çalışmadı. Bunun yerine "Yedeği Metin Olarak Göster / Kopyala" butonunu kullanabilirsiniz.');
    openTextBackupModal();
  }
}
let textBackupOpen = false;
let textImportOpen = false;
function openTextBackupModal(){ textBackupOpen = true; render(); }
function closeTextBackupModal(){ textBackupOpen = false; const ov=document.getElementById('textBackupOverlay'); if(ov) ov.remove(); }
function renderTextBackupModal(){
  const existing = document.getElementById('textBackupOverlay'); if(existing) existing.remove();
  const data = {students, payments, installments, invoiceContacts, exportedAt:new Date().toISOString()};
  const json = JSON.stringify(data);
  const div = document.createElement('div'); div.id='textBackupOverlay'; div.className='overlay';
  div.onclick=(e)=>{ if(e.target===div) closeTextBackupModal(); };
  div.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <h3>Yedek Metni</h3>
    <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">Aşağıdaki metnin tamamını kopyalayıp Notlar veya benzeri bir uygulamaya kaydedin. Geri yüklemek için "Metinden İçe Aktar" bölümüne yapıştırın.</p>
    <textarea id="backupTextArea" readonly style="width:100%; height:160px; font-family:var(--mono); font-size:11px; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--text);">${json}</textarea>
    <div class="modal-actions">
      <button class="secondary" onclick="closeTextBackupModal()">Kapat</button>
      <button class="primary" onclick="copyBackupText()">Kopyala</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
function copyBackupText(){
  const ta = document.getElementById('backupTextArea');
  ta.focus(); ta.select();
  let copied = false;
  try{ copied = document.execCommand('copy'); }catch(e){}
  if(!copied && navigator.clipboard){
    navigator.clipboard.writeText(ta.value).then(()=>showAlert('Kopyalandı.')).catch(()=>showAlert('Kopyalanamadı, metni elle seçip kopyalayın.'));
    return;
  }
  showAlert(copied ? 'Kopyalandı.' : 'Kopyalanamadı, metni elle seçip kopyalayın.');
}
function openTextImportModal(){ textImportOpen = true; render(); }
function closeTextImportModal(){ textImportOpen = false; const ov=document.getElementById('textImportOverlay'); if(ov) ov.remove(); }
function renderTextImportModal(){
  const existing = document.getElementById('textImportOverlay'); if(existing) existing.remove();
  const div = document.createElement('div'); div.id='textImportOverlay'; div.className='overlay';
  div.onclick=(e)=>{ if(e.target===div) closeTextImportModal(); };
  div.innerHTML = `<div class="modal" onclick="event.stopPropagation()">
    <h3>Metinden İçe Aktar</h3>
    <p style="font-size:12px;color:var(--muted);margin:0 0 10px;">Kaydettiğiniz yedek metnini aşağıya yapıştırın.</p>
    <textarea id="importTextArea" placeholder='{"students":[...],"payments":[...]}' style="width:100%; height:160px; font-family:var(--mono); font-size:11px; padding:10px; border-radius:8px; border:1px solid var(--line); background:var(--surface2); color:var(--text);"></textarea>
    <div class="modal-actions">
      <button class="secondary" onclick="closeTextImportModal()">Vazgeç</button>
      <button class="primary" onclick="submitTextImport()">İçe Aktar</button>
    </div>
  </div>`;
  document.body.appendChild(div);
}
function submitTextImport(){
  const raw = document.getElementById('importTextArea').value.trim();
  try{
    const data = JSON.parse(raw);
    if(!Array.isArray(data.students) || !Array.isArray(data.payments)) throw new Error('geçersiz format');
    closeTextImportModal();
    askConfirm('Mevcut liste, yapıştırılan yedekle değiştirilecek.', ()=>{
      students = data.students; payments = data.payments; installments = Array.isArray(data.installments) ? data.installments : [];
      invoiceContacts = Array.isArray(data.invoiceContacts) ? data.invoiceContacts : [];
      saveList('coach_students_v3', students);
      saveList('coach_payments_v3', payments);
      saveList('coach_installments_v1', installments);
      saveList('coach_invoice_contacts_v1', invoiceContacts);
      render();
    });
  }catch(err){
    showAlert('Yapıştırılan metin okunamadı. Doğru bir yedek metni olduğundan emin olun.');
  }
}
function handleImportFile(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      if(!Array.isArray(data.students) || !Array.isArray(data.payments)) throw new Error('geçersiz format');
      askConfirm('Mevcut liste, yedekteki verilerle değiştirilecek.', ()=>{
        students = data.students; payments = data.payments; installments = Array.isArray(data.installments) ? data.installments : [];
        invoiceContacts = Array.isArray(data.invoiceContacts) ? data.invoiceContacts : [];
        saveList('coach_students_v3', students);
        saveList('coach_payments_v3', payments);
        saveList('coach_installments_v1', installments);
        saveList('coach_invoice_contacts_v1', invoiceContacts);
        render();
      });
    }catch(err){
      showAlert('Yedek dosyası okunamadı. Doğru bir yedek dosyası seçtiğinizden emin olun.');
    }
    evt.target.value = '';
  };
  reader.readAsText(file);
}

loadAll();
</script>
</body>
</html>
